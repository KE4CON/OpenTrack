# OpenTrack server setup — settings file
# ---------------------------------------------------------------------------
# Copy this to opentrack-server.conf, edit the values you care about, then run:
#
#     powershell -ExecutionPolicy Bypass -File .\Install-OpenTrackServer.ps1 -ConfigFile .\opentrack-server.conf
#
# One "Key = Value" per line. Lines starting with # are comments. Anything you
# leave out keeps its built-in default (shown here). A value you also pass on the
# command line wins over this file.
# ---------------------------------------------------------------------------

# This one file works for BOTH the Windows script (Install-OpenTrackServer.ps1)
# and the macOS script (install-opentrack-server.sh) — the keys are the same.
# The path examples below are Windows-style; on a Mac use Unix paths (see the
# macOS block just under each one).

# --- Where things go ---------------------------------------------------------
# SourceDir   : where the code is cloned (ignored if you run the script from inside a clone)
# InstallDir  : where the built, ready-to-run programs are placed
# DataDir     : where the database and backups live — keep this on a drive you back up
#
# Windows defaults:
SourceDir  = C:\OpenTrack\src
InstallDir = C:\OpenTrack\app
DataDir    = C:\OpenTrack\data
# macOS defaults (uncomment and use these instead on a Mac):
# SourceDir  = /usr/local/opentrack/src
# InstallDir = /usr/local/opentrack/app
# DataDir    = /usr/local/opentrack/data

# --- Network -----------------------------------------------------------------
# BindAddress : 0.0.0.0 = reachable from other computers on your network (normal).
#               127.0.0.1 = this machine only.
# WebPort     : the address people open in a browser.
# ApiPort     : the address the Windows/Mac desktop app talks to.
BindAddress = 0.0.0.0
WebPort     = 5035
ApiPort     = 5003

# --- Source ------------------------------------------------------------------
RepoUrl = https://github.com/KE4CON/OpenTrack.git
Branch  = main

# --- First administrator (optional) -----------------------------------------
# If you set BOTH of these, this account is created/promoted to Administrator at
# first start, so you don't rely on "first person to register wins." Leave blank
# to use the register-first-account method instead. This file is readable only by
# administrators, which is why it's a reasonable place to put the password.
AdminEmail    =
AdminPassword =

# --- Local AI (optional) -----------------------------------------------------
# InstallAi = true also installs a free, private local AI (Ollama) on this machine
# and turns OpenTrack's AI features on, pointed at it. Nothing leaves your network.
# Needs a reasonably capable machine (about 16 GB of memory is the sweet spot).
InstallAi = false
AiModel   = llama3.1

# --- Security ----------------------------------------------------------------
# RequireHttps = true forces encrypted HTTPS. Leave false for a trusted home/office
# network on plain HTTP. If you turn it on you must also provide a certificate.
RequireHttps = false

# --- Skips (advanced) --------------------------------------------------------
# SkipPrereqs  = true : don't try to install the .NET SDK / Git (assume present)
# SkipFirewall = true : don't add firewall rules
SkipPrereqs  = false
SkipFirewall = false
